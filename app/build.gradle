plugins {
    id 'com.android.application'
}

android {
    namespace 'org.lupce.player'
    compileSdk 34

    defaultConfig {
        applicationId "org.lupce.player"
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "3.0"
    }

    // One code, six apps (Part A to Part F): each Part has its own app and its own recordings.
    flavorDimensions "part"
    productFlavors {
        partA {
            dimension "part"
            applicationId "org.lupce.player"
            manifestPlaceholders = [appLabel: "LUPCE Part A"]
        }
        partB {
            dimension "part"
            applicationId "org.lupce.player.partb"
            manifestPlaceholders = [appLabel: "LUPCE Part B"]
        }
        partC {
            dimension "part"
            applicationId "org.lupce.player.partc"
            manifestPlaceholders = [appLabel: "LUPCE Part C"]
        }
        partD {
            dimension "part"
            applicationId "org.lupce.player.partd"
            manifestPlaceholders = [appLabel: "LUPCE Part D"]
        }
        partE {
            dimension "part"
            applicationId "org.lupce.player.parte"
            manifestPlaceholders = [appLabel: "LUPCE Part E"]
        }
        partF {
            dimension "part"
            applicationId "org.lupce.player.partf"
            manifestPlaceholders = [appLabel: "LUPCE Part F"]
        }
    }

    signingConfigs {
        release {
            storeFile file("lupce-release.jks")
            storePassword "LupcePlayer2026"
            keyAlias "lupce"
            keyPassword "LupcePlayer2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
