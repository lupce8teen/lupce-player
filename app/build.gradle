plugins {
    id 'com.android.application'
}

android {
    namespace 'org.lupce.player'
    compileSdk 34

    defaultConfig {
        applicationId "org.lupce.player"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file("lupce-release.jks")
            storePassword "LupcePlayer2026"
            keyAlias "lupce"
            keyPassword "LupcePlayer2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
